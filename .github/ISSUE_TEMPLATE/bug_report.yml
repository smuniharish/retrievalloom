name: Bug report
description: Report a problem with RetrievalLoom
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out as much
        of this form as you can: it helps us reproduce and fix the issue
        faster.

  - type: input
    id: version
    attributes:
      label: RetrievalLoom version
      description: Output of `python -c "import retrievalloom; print(retrievalloom.__version__)"`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.4"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A minimal, self-contained, runnable script that reproduces the issue.
        Include the components passed to `create_retrieval_engine` (metadata
        store, vector store mode, embedding, graph or structure backends) and
        any non-default configuration.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Relevant log output / traceback
      description: Paste any error output. This will be rendered as a code block automatically.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant (OS, backend versions such as Qdrant, deployment environment, etc.).
