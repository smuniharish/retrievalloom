name: Feature request
description: Suggest an idea or capability for RetrievalLoom
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please note that RetrievalLoom has
        deliberate scope boundaries (see the project's README): it is
        embeddable retrieval and evidence infrastructure, not a hosted
        service, agent framework, RAG application framework, embedding
        provider, or document parser. Requests about ingestion, indexing,
        lifecycle, retrieval channels, the evidence pipeline, tenancy, and
        extension contracts are the best fit.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or limitation you've run into.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What would you like to see added or changed? If you have an idea for
        the API shape (new extension ABC, adapter, configuration option,
        domain model field, etc.), sketch it here.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds you've tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, references, or examples from other projects that motivate this request.
