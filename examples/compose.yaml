# Qdrant server for the live examples (byo_embeddings_qdrant.py).
#
#   podman compose -f examples/compose.yaml up -d      # or: docker compose -f ... up -d
#   export RL_EXAMPLES_QDRANT_URL=http://localhost:6333  # PowerShell: $env:RL_EXAMPLES_QDRANT_URL="http://localhost:6333"
#   podman compose -f examples/compose.yaml down       # add -v to delete the volume
#
# Equivalent without compose:
#   podman run -d --name rl-qdrant -p 6333:6333 -p 6334:6334 qdrant/qdrant
services:
  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: rl-examples-qdrant
    ports:
      - "6333:6333" # HTTP/REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant-storage:
