# Services used by the live examples and the live test suite. Every image is pinned.
#
#   podman compose -f examples/compose.yaml up -d      # or: docker compose -f ... up -d
#   podman compose -f examples/compose.yaml down       # add -v to delete the volumes
#
# Then point the examples at them (PowerShell shown; RL_TEST_* names work too):
#   $env:RL_EXAMPLES_MODELS_DIR="models"                       # local model weights
#   $env:RL_EXAMPLES_QDRANT_URL="http://localhost:6333"         # customer_support, durable_restart
#   $env:RL_EXAMPLES_PGVECTOR_DSN="postgresql://rl:rl@localhost:55433/rl"  # document_lifecycle
#   $env:RL_EXAMPLES_NEO4J_URL="bolt://localhost:7687"          # knowledge_graph (neo4j/retrievalloom)
#   $env:RL_EXAMPLES_OTLP_URL="http://localhost:4318"           # observability_jaeger
#   $env:RL_EXAMPLES_JAEGER_URL="http://localhost:16686"        # Jaeger UI and query API
#
# postgres (port 55432) backs the library's PostgreSQL metadata store tests
# (RL_TEST_POSTGRES_DSN=postgresql://rl:rl@localhost:55432/rl).
services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.19.1
    container_name: rl-qdrant
    ports:
      - "6333:6333" # HTTP/REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant-storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: docker.io/library/postgres:18.6-alpine
    container_name: rl-postgres
    environment:
      POSTGRES_USER: rl
      POSTGRES_PASSWORD: rl
      POSTGRES_DB: rl
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    restart: unless-stopped

  pgvector:
    image: docker.io/pgvector/pgvector:0.8.7-pg18
    container_name: rl-pgvector
    environment:
      POSTGRES_USER: rl
      POSTGRES_PASSWORD: rl
      POSTGRES_DB: rl
    ports:
      - "55433:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql
    restart: unless-stopped

  neo4j:
    image: docker.io/library/neo4j:5.26.33-community
    container_name: rl-neo4j
    environment:
      NEO4J_AUTH: neo4j/retrievalloom
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  jaeger:
    image: docker.io/jaegertracing/jaeger:2.23.0
    container_name: rl-jaeger
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "16686:16686" # UI and query API
    restart: unless-stopped

volumes:
  qdrant-storage:
  postgres-data:
  pgvector-data:
  neo4j-data: